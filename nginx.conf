server {
    listen 80;
    server_name talentsenegal.com www.talentsenegal.com;

    root /usr/share/nginx/html;
    index index.html;


    location /api/ {
        proxy_pass http://teranga-backend:8081/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }


    location / {
        try_files $uri $uri/ /index.html;
    }


    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
