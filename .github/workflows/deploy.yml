- name: Deploy backend on VPS
  uses: appleboy/ssh-action@v1.0.3
  with:
    host: ${{ secrets.SERVER_HOST }}
    username: ubuntu
    key: ${{ secrets.SSH_KEY }}
    script: |
      set -e

      cd /opt/talent-senegal/backend

      echo "=== Téléchargement de la nouvelle image ==="
      docker pull christian190300/terangasenegaluser:latest

      echo "=== Redémarrage du backend ==="
      docker compose up -d --force-recreate backend

      echo "=== Nettoyage ==="
      docker image prune -f

      echo "=== Vérification ==="
      docker ps --filter "name=teranga-backend"

      echo "=== Déploiement terminé ==="